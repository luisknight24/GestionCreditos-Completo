<div class="login-bg">
    <!-- Ambient Lighting Effects (Blue top-left, Red left, Yellow right) -->
    <div class="ambient-glow glow-blue-topleft"></div>
    <div class="ambient-glow glow-red-left"></div>
    <div class="ambient-glow glow-yellow-right"></div>
    <div class="bg-grid-pattern"></div>

    <div class="login-container">
        <mat-card class="modern-card">
            <div class="header-section">
                <div class="logo-wrapper">
                    <div class="logo-glow"></div>
                    <img src="cellcompay.jpg" alt="CellComPay" class="company-logo">
                </div>
                <h1 class="welcome-title">Bienvenido de nuevo</h1>
                <p class="welcome-subtitle">Ingresa tu cuenta para acceder al panel de control</p>
            </div>

            <form [formGroup]="formLogin" (ngSubmit)="iniciarSesion()" class="login-form">
                <mat-form-field appearance="outline" class="custom-field">
                    <mat-label>Correo Electrónico</mat-label>
                    <input matInput formControlName="correo" placeholder="admin@cellcompay.com" type="email">
                    <mat-icon matPrefix class="field-icon">mail_outline</mat-icon>
                    <mat-error *ngIf="formLogin.get('correo')?.hasError('required')">El correo es requerido</mat-error>
                    <mat-error *ngIf="formLogin.get('correo')?.hasError('email')">Formato de correo inválido</mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="custom-field">
                    <mat-label>Contraseña</mat-label>
                    <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="clave"
                        placeholder="••••••••">
                    <mat-icon matPrefix class="field-icon">lock_open</mat-icon>
                    <button mat-icon-button matSuffix (click)="ocultarPassword = !ocultarPassword" type="button"
                        class="eye-btn">
                        <mat-icon>{{ocultarPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                    </button>
                    <mat-error *ngIf="formLogin.get('clave')?.hasError('required')">La contraseña es
                        requerida</mat-error>
                </mat-form-field>

                <div class="actions-row">
                    <button mat-button type="button" class="forgot-btn" (click)="recuperarContrasena()">
                        ¿Olvidaste tu contraseña?
                    </button>
                </div>

                <div class="buttons-section">
                    <button mat-flat-button class="main-btn" type="submit" [disabled]="formLogin.invalid || isLoading">
                        <ng-container *ngIf="!isLoading">
                            <span>INICIAR SESIÓN</span>
                            <mat-icon class="btn-arrow">arrow_forward</mat-icon>
                        </ng-container>
                        <div class="loader-content" *ngIf="isLoading">
                            <mat-spinner diameter="20" class="custom-spinner"></mat-spinner>
                            <span>Autenticando...</span>
                        </div>
                    </button>
                </div>
            </form>
        </mat-card>

        <!-- <p class="copyright">© 2026 CellComPay Ecuador · Todos los derechos reservados</p> -->
    </div>
</div>
